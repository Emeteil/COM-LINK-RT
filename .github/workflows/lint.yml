name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pip install clang-format==23.1.1

      - name: clang-format
        run: |
          FILES=$(find src -iname "*.cpp" -o -iname "*.h" | grep -v '\.bak$'; echo com-link-RT.ino)
          clang-format --dry-run --Werror $FILES
