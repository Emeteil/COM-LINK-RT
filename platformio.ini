; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = platformio_local.ini

src_dir = .

[common]
platform = ststm32
board = black_f407ve
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.3
    jrowberg/I2Cdevlib-MPU6050@^1.0.0

build_src_filter =
    +<*>
    -<.git/>
    -<.github/>
    -<.pio/>
    -<.vscode/>
    -<Makefile>
    -<*.md>
    -<*.MD>
    -<*.ini>
    -<*.example>

; Прошивка через ST-Link по SWD, используя OpenOCD, который PlatformIO
; скачивает и запускает сам. Используется по умолчанию (pio run -t upload).
[env:black_f407ve]
extends = common
upload_protocol = stlink

; Прошивка через встроенный USB DFU-бутлоадер (BOOT0 -> 1, USB-кабель в OTG, без ST-Link):
;   pio run -e black_f407ve_dfu -t upload
[env:black_f407ve_dfu]
extends = common
upload_protocol = dfu

; Прошивка через USB-UART переходник и системный serial-бутлоадер
; (BOOT0 -> 1, порт задаётся ниже или через -e ... --upload-port):
;   pio run -e black_f407ve_serial -t upload
[env:black_f407ve_serial]
extends = common
upload_protocol = serial
upload_port = COM9
